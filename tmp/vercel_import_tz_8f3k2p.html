<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Расчёт регистрации ТЗ</title><style>
:root{--n:#0d2345;--g:#c58a1d;--bg:#f5f7fb;--m:#68758b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--n);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.w{max-width:620px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:17px;margin-bottom:10px;box-shadow:0 6px 20px #0d23450c}.tar{border:1px solid #e5c582}.rec{background:var(--n);color:#fff;border-color:var(--n)}h1{font-size:22px;margin:0 0 5px}.muted{color:var(--m);font-size:12px}.rec .muted{color:#dbe5f4}.price{font-size:26px;font-weight:900;margin:7px 0}.row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #e5e8ee;padding-top:10px;margin-top:11px}.rec .row{border-color:#53637e}.tag{color:var(--g);font-size:10px;font-weight:900;letter-spacing:.4px}.editor{display:none}.editor.show{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:var(--m);margin-bottom:5px}input{width:100%;padding:13px;border:1px solid #d9deea;border-radius:12px;font-size:16px}button{width:100%;margin-top:12px;border:0;border-radius:12px;padding:14px;background:var(--n);color:#fff;font-weight:800;font-size:14px;cursor:pointer}.link{display:none;word-break:break-all;background:#f6f8fc;border-radius:12px;padding:12px;margin-top:10px;font-weight:800;color:var(--n);text-decoration:none}.link.show{display:block}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="w">
<div id="editor" class="card editor"><h1>Калькулятор регистрации ТЗ</h1><div class="muted" style="margin-bottom:14px">Введи бренд и госпошлины — ссылка клиенту сформируется мгновенно.</div><div class="grid"><div><label>Название бренда</label><input id="b" placeholder="Например, WG"></div><div><label>Госпошлины, ₽</label><input id="d" inputmode="numeric" placeholder="Например, 35000"></div></div><button id="make">Сформировать ссылку клиенту</button><a id="link" class="link" target="_blank" rel="noopener"></a></div>
<div id="client"></div></div><script>
const P=[26990,30980,32970],q=new URLSearchParams(location.search),edit=q.get('edit')==='1',b=(q.get('b')||'').trim(),d=Math.max(0,parseInt((q.get('d')||'').replace(/\D/g,''))||0),f=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽',e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
function render(){if(edit&&!b&&!d){document.getElementById('editor').classList.add('show');document.getElementById('client').innerHTML='';return}const t=b?'Расчёт регистрации «'+e(b)+'»':'Расчёт регистрации товарного знака';document.title=b?'Регистрация '+b:'Расчёт регистрации ТЗ';document.getElementById('client').innerHTML=`<div class="card"><h1>${t}</h1><div class="muted">Индивидуальный расчёт стоимости регистрации</div></div><div class="card tar"><b>Базовый</b><div class="price">26 990 ₽</div><div class="muted">Полное сопровождение до получения свидетельства.</div><div class="row"><span>Итого с пошлинами</span><b>${f(P[0]+d)}</b></div></div><div class="card tar rec"><div class="tag">РЕКОМЕНДУЕМ</div><b>Расширенный ★</b><div class="price">30 980 ₽</div><div class="muted">+ 1 дополнительная услуга на выбор в течение 3 лет.</div><div class="row"><span>Итого с пошлинами</span><b>${f(P[1]+d)}</b></div></div><div class="card tar"><b>Железно 10 лет</b><div class="price">32 970 ₽</div><div class="muted">+ 3 услуги сопровождения на 10 лет.</div><div class="row"><span>Итого с пошлинами</span><b>${f(P[2]+d)}</b></div></div><div class="card"><div class="row" style="border:0;margin:0;padding:0"><span>Госпошлины Роспатента</span><b>${f(d)}</b></div></div>`}
document.addEventListener('click',ev=>{if(ev.target.id==='make'){const bb=document.getElementById('b').value.trim(),dd=(document.getElementById('d').value||'').replace(/\D/g,'');if(!dd){document.getElementById('d').focus();return}const u=new URL(location.origin+location.pathname);if(bb)u.searchParams.set('b',bb);u.searchParams.set('d',dd);const a=document.getElementById('link');a.href=u.toString();a.textContent=u.toString();a.classList.add('show')}});render();
</script></body></html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Обновление Second Brain OS V108</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#f4f7fb,#f6f0ff);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#1e2432}.card{width:min(100%,650px);padding:30px;border:1px solid rgba(121,87,214,.16);border-radius:28px;background:rgba(255,255,255,.94);box-shadow:0 24px 80px rgba(65,47,115,.14)}h1{margin:0 0 10px;font-size:clamp(27px,5vw,42px);line-height:1.08}p{color:#697187}.status{min-height:54px;margin:20px 0;padding:14px 16px;border-radius:16px;background:#f5f1ff;color:#6648bd;font-weight:700}button,a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border:0;border-radius:15px;padding:12px 18px;font:inherit;font-weight:850;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(135deg,#8f6cf6,#6d4edf);color:#fff}.secondary{background:#eef1f7;color:#384152;margin-left:8px}small{display:block;margin-top:18px;color:#858c9d}
  </style>
</head>
<body>
  <main class="card">
    <small>SECOND BRAIN OS</small>
    <h1>Обновление интерфейса V108</h1>
    <p>Удаляется только старый кэш интерфейса и регистрация Service Worker. Ваши записи в localStorage и IndexedDB не удаляются.</p>
    <div class="status" id="status">Готово к безопасному обновлению.</div>
    <button class="primary" id="recover" type="button">Обновить интерфейс</button>
    <a class="secondary" href="./?v=108#information">Открыть приложение</a>
    <small>Ключ secondBrainOS.v1 и пользовательская база остаются без изменений.</small>
  </main>
  <script>
    document.getElementById('recover').addEventListener('click',async()=>{
      const status=document.getElementById('status');
      try{
        status.textContent='Удаляю только старый UI-кэш…';
        if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(item=>item.unregister()));}
        if('caches' in window){const names=await caches.keys();await Promise.all(names.filter(name=>name.startsWith('second-brain-os-')||name.startsWith('second-brain-space-')).map(name=>caches.delete(name)));}
        status.textContent='Готово. Открываю V108…';
        setTimeout(()=>location.replace('./?v=108#information'),650);
      }catch(error){console.error(error);status.textContent='Не удалось автоматически обновить кэш. Закройте вкладку и откройте приложение снова.';}
    });
  </script>
</body>
</html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Восстановление Second Brain OS</title><style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f7f4ff,#eef9ff);color:#20223a;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(620px,100%);background:#fff;border:1px solid #e3ddf5;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(56,48,104,.12)}h1{margin:0 0 10px;font-size:28px}p{line-height:1.55;color:#686e83}button{width:100%;min-height:48px;border:0;border-radius:14px;background:#6852d8;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.status{margin-top:16px;padding:12px;border-radius:12px;background:#f5f3ff;white-space:pre-wrap;font-size:13px}</style></head><body><main class="card"><h1>Безопасное восстановление V101</h1><p>Будет удалён только кэш интерфейса и старая регистрация Service Worker. Финансы, задачи, привычки, календарь и другие записи не удаляются.</p><button id="recover">Восстановить загрузку приложения</button><div id="status" class="status">Готово к запуску.</div></main><script>'use strict';const button=document.getElementById('recover'),status=document.getElementById('status');button.onclick=async()=>{button.disabled=true;status.textContent='Останавливаю старый интерфейс…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/second-brain-oc/')||r.active?.scriptURL?.includes('/second-brain-oc/')).map(r=>r.unregister()))}status.textContent+='\nОчищаю только кэши Second Brain OS…';if('caches'in window){const names=await caches.keys();await Promise.all(names.filter(n=>n.startsWith('second-brain-os-')).map(n=>caches.delete(n)))}status.textContent+='\nДанные не затронуты. Открываю V101…';setTimeout(()=>location.replace('./?v=101&recovered=1#today'),500)}catch(e){status.textContent='Ошибка восстановления: '+(e?.message||e);button.disabled=false}};</script></body></html>

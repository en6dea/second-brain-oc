<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Second Brain OS V113 — восстановление</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;font-family:Onest,Arial,sans-serif;color:#1b2035}.card{width:min(620px,calc(100% - 32px));padding:30px;border:1px solid #e4e7f0;border-radius:26px;background:#fff;box-shadow:0 25px 80px rgba(38,48,77,.13)}h1{margin:0 0 10px;font-size:30px}p{color:#6d778d;line-height:1.6}button,a{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:0 18px;border:0;border-radius:14px;background:linear-gradient(110deg,#7658e7,#3f88f0);color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.secondary{background:#f3efff;color:#654bc6}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}code{padding:2px 6px;border-radius:6px;background:#f2f3f7}</style></head><body><section class="card"><small>SECOND BRAIN OS · V113</small><h1>Безопасное обновление интерфейса</h1><p>Удаляются только старые Service Worker и UI-кэши. Данные в <code>localStorage</code>, IndexedDB, финансы, цели, привычки, свои опыты и планы месяцев не очищаются.</p><div class="actions"><button id="recover">Обновить интерфейс</button><a class="secondary" href="./?v=113-r1#couple-random">Открыть опыт месяца</a></div><p id="status"></p></section><script>document.getElementById('recover').onclick=async()=>{const status=document.getElementById('status');status.textContent='Обновляем интерфейс…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('second-brain-os-')||k.startsWith('second-brain-space-')).map(k=>caches.delete(k)));}status.textContent='Готово. Пользовательские данные сохранены.';setTimeout(()=>location.href='./?v=113-r1#couple-random',500);}catch(e){status.textContent='Не удалось обновить автоматически: '+e.message;}};</script></body></html>
